appId: de.blueskyinnovations.watcho
# Feature 002 — My Lists Tab Navigation
# AC-06: Each empty tab renders the appropriate empty-state message.
---
- runFlow: _setup/onboarded.yml
- tapOn:
    id: "my-lists:tab-watchlist"
- assertVisible: "Your watchlist is empty"
- tapOn:
    id: "my-lists:tab-watching"
- assertVisible: "You're not watching anything"
- tapOn:
    id: "my-lists:tab-watched"
- assertVisible: "No titles watched yet"
