appId: de.blueskyinnovations.watcho
# Helper: add "Inception" (2010) to the Watching list.
# Depends on: onboarded.yml already run (app is on My Lists screen).
---
- tapOn: "Search"
- tapOn:
    id: "search-bar:input"
- inputText: "Inception"
- assertVisible:
    id: "media-card:Inception"
- tapOn:
    id: "media-card:Inception"
- scrollUntilVisible:
    element:
      id: "status-selector:btn-watching"
    direction: DOWN
- tapOn:
    id: "status-selector:btn-watching"
- pressKey: Back
- tapOn: "My Lists"
- assertVisible:
    id: "my-lists:tab-watching"
