appId: de.blueskyinnovations.watcho
# Helper: add "Breaking Bad" to the Watching list.
# Depends on: onboarded.yml already run (app is on My Lists screen).
---
- tapOn: "Search"
- tapOn:
    id: "search-bar:input"
- inputText: "Breaking Bad"
- assertVisible:
    id: "media-card:Breaking Bad"
- tapOn:
    id: "media-card:Breaking Bad"
- scrollUntilVisible:
    element:
      id: "status-selector:btn-watching"
    direction: DOWN
- tapOn:
    id: "status-selector:btn-watching"
- pressKey: Back
- tapOn: "My Lists"
- assertVisible:
    id: "my-lists:tab-watching"
