appId: de.blueskyinnovations.watcho
# Feature 007 — Movie Detail: Remove
# AC-03: After removal, the item no longer appears in My Lists.
---
- runFlow: _setup/onboarded.yml
- runFlow: _setup/add-inception-watching.yml
- tapOn:
    id: "media-card:Inception"
- scrollUntilVisible:
    element:
      id: "movie-detail:btn-remove"
    direction: DOWN
- tapOn:
    id: "movie-detail:btn-remove"
- pressKey: Back
- assertVisible:
    id: "my-lists:tab-watching"
# Watching tab should show empty state — Inception was removed
- assertVisible: "You're not watching anything"
- assertNotVisible:
    id: "my-lists:count-watching"
