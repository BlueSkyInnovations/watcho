appId: de.blueskyinnovations.watcho
# Feature 010 — Settings: Appearance
# AC-02: The Dark theme option is visible and can be tapped.
---
- runFlow: _setup/onboarded.yml
- runFlow: _setup/navigate-to-settings.yml
- assertVisible:
    id: "settings:btn-theme-dark"
- tapOn:
    id: "settings:btn-theme-dark"
- assertVisible: "Dark"
