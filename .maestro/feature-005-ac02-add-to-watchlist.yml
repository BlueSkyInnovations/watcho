appId: de.blueskyinnovations.watcho
# Feature 005 — Movie Detail: Add to List / Status
# AC-02: Tapping the Watchlist button adds the movie to the Watchlist.
---
- runFlow: _setup/onboarded.yml
- tapOn: "Search"
- tapOn:
    id: "search-bar:input"
- inputText: "Inception"
- assertVisible:
    id: "media-card:Inception"
- tapOn:
    id: "media-card:Inception"
- tapOn:
    id: "status-selector:btn-watchlist"
- assertVisible:
    id: "movie-detail:btn-remove"
- tapOn:
    id: "movie-detail:back-btn"
- tapOn:
    id: "my-lists:tab-watchlist"
- assertVisible: "Inception"
