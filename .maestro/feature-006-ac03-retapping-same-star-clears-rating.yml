appId: de.blueskyinnovations.watcho
# Feature 006 — Movie Detail: Rating & Review
# AC-03: Tapping the currently selected star again clears the rating (sets to 0).
---
- runFlow: _setup/onboarded.yml
- runFlow: _setup/add-inception-watching.yml
- tapOn:
    id: "media-card:Inception"
- scrollUntilVisible:
    element:
      id: "rating-stars:star-3"
    direction: DOWN
- tapOn:
    id: "rating-stars:star-3"
# Re-tap same star to unrate
- tapOn:
    id: "rating-stars:star-3"
# Item is still tracked (remove button still present)
- scrollUntilVisible:
    element:
      id: "movie-detail:btn-remove"
    direction: DOWN
- assertVisible:
    id: "movie-detail:btn-remove"
