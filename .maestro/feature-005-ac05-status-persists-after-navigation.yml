appId: de.blueskyinnovations.watcho
# Feature 005 — Movie Detail: Add to List / Status
# AC-05: The selected status persists when navigating away and back to the detail screen.
---
- runFlow: _setup/onboarded.yml
- runFlow: _setup/add-inception-watching.yml
# Navigate back to Inception detail via My Lists
- tapOn:
    id: "media-card:Inception"
- scrollUntilVisible:
    element:
      id: "status-selector:btn-watching"
    direction: DOWN
# Status selector should show Watching as the current status (highlighted)
- assertVisible:
    id: "status-selector:btn-watching"
- scrollUntilVisible:
    element:
      id: "movie-detail:btn-remove"
    direction: DOWN
- assertVisible:
    id: "movie-detail:btn-remove"
